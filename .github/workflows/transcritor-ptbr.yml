name: Transcritor PT-BR APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'projetos/transcritor-ptbr/**'
      - '.github/workflows/transcritor-ptbr.yml'
permissions:
  contents: read
  issues: write
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projetos/transcritor-ptbr
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Instalar SDK nativo Android
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "cmake;3.22.1" "ndk;27.2.12479018"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Obter motor Whisper.cpp
        run: git clone --depth 1 --branch v1.7.6 https://github.com/ggml-org/whisper.cpp.git app/src/main/cpp/whisper
      - name: Compilar e registrar erros
        id: compile
        shell: bash
        run: |
          set -o pipefail
          gradle :app:assembleDebug --stacktrace --no-daemon 2>&1 | tee build.log
      - name: Publicar diagnóstico automaticamente
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          {
            echo "Falha de compilação do Voz em Texto."
            echo
            echo "Commit: ${{ github.sha }}"
            echo
            echo '~~~'
            if [ -f build.log ]; then tail -n 120 build.log; else echo "Falha antes da compilação Gradle: ver etapas do workflow."; fi
            echo '~~~'
          } > build-failure.md
          gh issue create --repo "${{ github.repository }}" --title "Diagnóstico automático APK ${{ github.run_number }}" --body-file build-failure.md

      - uses: actions/upload-artifact@v4
        with:
          name: transcritor-ptbr-debug
          path: projetos/transcritor-ptbr/app/build/outputs/apk/debug/*.apk
