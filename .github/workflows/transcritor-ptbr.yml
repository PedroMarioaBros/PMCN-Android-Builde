name: Transcritor PT-BR APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'projetos/transcritor-ptbr/**'
      - '.github/workflows/transcritor-ptbr.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projetos/transcritor-ptbr
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Instalar SDK nativo Android
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "cmake;3.22.1" "ndk;27.2.12479018"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Obter motor Whisper.cpp
        run: git clone --depth 1 --branch v1.7.6 https://github.com/ggml-org/whisper.cpp.git app/src/main/cpp/whisper
      - run: gradle :app:assembleDebug --stacktrace --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: transcritor-ptbr-debug
          path: projetos/transcritor-ptbr/app/build/outputs/apk/debug/*.apk
