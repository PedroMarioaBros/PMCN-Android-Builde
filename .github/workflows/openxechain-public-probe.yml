name: OpenXeChain Public Runner Probe

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/openxechain-public-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - name: Prove public runner works
        run: |
          echo "PUBLIC_RUNNER_OK"
          uname -a
          free -h
